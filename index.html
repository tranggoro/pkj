<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beauty Product Cost Calculator</title>
  <style>
    body {
      font-family: 'Montserrat', 'Arial', sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: #f0f7f0;
      color: #333;
      background-image: linear-gradient(to bottom, rgba(0, 80, 0, 0.1) 0%, rgba(240, 247, 240, 1) 100%);
    }

    * {
      box-sizing: border-box;
    }

    h1 {
      color: #1a3e1a;
      text-align: center;
      margin-bottom: 30px;
      font-weight: 600;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
      letter-spacing: 1px;
      font-size: 6vw;
    }

    .calculator {
      background-color: white;
      padding: 5vw;
      border-radius: 10px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      border: 1px solid #a3c1a3;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #2d4d2d;
      font-size: 4vw;
    }

    select,
    input {
      width: 100%;
      padding: 3vw;
      border: 1px solid #b8d0b8;
      border-radius: 6px;
      font-size: 4vw;
      background-color: #f5faf5;
    }

    #add-to-cart-btn,
    #whatsapp-btn {
      font-size: 4vw;
      padding: 4vw;
      border-radius: 6px;
    }

    .cart ul li span {
      font-size: 4vw;
    }

    .total {
      font-size: 4.5vw;
    }

    .cart-item-image {
      width: 10vw;
      height: 10vw;
    }

    .logo {
      max-width: 100%;
      height: auto;
    }

    @media (min-width: 600px) {
      h1 {
        font-size: 28px;
      }
      label,
      select,
      input,
      #add-to-cart-btn,
      #whatsapp-btn,
      .cart ul li span,
      .total {
        font-size: 16px;
      }
      .cart-item-image {
        width: 40px;
        height: 40px;
      }
    }
  </style>
</head>
<body>
    <h1>Pentol Kabul Juragan </h1>
    
    <div class="calculator">
        <div class="logo-container">
            <img src="logoo.jpg" alt="Beauty Shop Logo" class="logo">
        </div>

        <div class="form-group">
            <label for="product-size">Product Selection</label>
            <select id="product-size" required>
                <option value="">Select a product</option>
                <option value="Pentol Kecil" data-price="55000" data-image="pk.jpg">Pentol Kecil 100 biji - Rp 55,000</option>
                <option value="Pentol Besar" data-price="60000" data-image="pb.jfif">Pentol Besar 25 biji - Rp 60,000</option>
                <option value="Pentol Jamur" data-price="35000" data-image="pj.jfif">Pentol jamur 50 biji - Rp 35,000</option>
                <option value="Pentol Mercon" data-price="35000" data-image="pm.jpg">Pentol Mercon 50 biji - Rp 35,000</option>
                <option value="Tahu Kotak" data-price="35000" data-image="tk.jpg">Tahu Kotak 50 biji - Rp 35,000</option>
                <option value="Tahu Bakso" data-price="55000" data-image="tb.jpg">Tahu Bakso 100 biji - Rp 55,000</option>
                <option value="Siomay Kubis" data-price="20000" data-image="sk.jpg">Siomay Kubis 25 biji - Rp 20,000</option>
                <option value="Siomay Pangsit" data-price="35000" data-image="sp.jpg">Siomay Pangsit 50 biji - Rp 35,000</option>
            </select>
            <div class="product-image-container" id="product-image-container">
                <img src="" alt="Product Image" class="product-image" id="product-image">
            </div>
        </div>
        
        <div class="form-group">
            <label for="quantity">Quantity</label>
            <input type="number" id="quantity" min="1" value="1" required>
        </div>
        
        <button id="add-to-cart-btn">Add to Cart</button>
        
        <div class="cart">
            <h3>Shopping Cart</h3>
            <ul id="cart-items">
                <li>No items in the cart</li>
            </ul>
            <div class="summary-item total">
                <span>Total Cart Price:</span>
                <span id="cart-total">Rp 0</span>
            </div>
        </div>
        
        <button id="whatsapp-btn" disabled>
            <span class="whatsapp-icon">📱</span>
            Order via WhatsApp
        </button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const productSizeSelect = document.getElementById('product-size');
            const quantityInput = document.getElementById('quantity');
            const addToCartBtn = document.getElementById('add-to-cart-btn');
            const cartItems = document.getElementById('cart-items');
            const cartTotal = document.getElementById('cart-total');
            const whatsappBtn = document.getElementById('whatsapp-btn');
            const productImageContainer = document.getElementById('product-image-container');
            const productImage = document.getElementById('product-image');
            
            let cart = [];
        
            // Show product image when product is selected
            productSizeSelect.addEventListener('change', function() {
                const selectedOption = this.options[this.selectedIndex];
                if (selectedOption.value) {
                    productImage.src = selectedOption.getAttribute('data-image');
                    productImageContainer.style.display = 'block';
                } else {
                    productImageContainer.style.display = 'none';
                }
            });
        
            function updateCart() {
                cartItems.innerHTML = '';
                let totalCartPrice = 0;
        
                if (cart.length === 0) {
                    cartItems.innerHTML = '<li>No items in the cart</li>';
                } else {
                    cart.forEach((item, index) => {
                        const listItem = document.createElement('li');
        
                        const itemContent = document.createElement('div');
                        itemContent.className = 'cart-item-content';
        
                        const itemImage = document.createElement('img');
                        itemImage.src = item.image;
                        itemImage.className = 'cart-item-image';
                        itemImage.alt = item.size;
        
                        const itemText = document.createElement('span');
                        itemText.textContent = `${item.quantity}x ${item.size} - Rp ${item.total.toLocaleString('id-ID')}`;
        
                        itemContent.appendChild(itemImage);
                        itemContent.appendChild(itemText);
        
                        const removeBtn = document.createElement('button');
                        removeBtn.textContent = 'Remove';
                        removeBtn.addEventListener('click', () => {
                            cart.splice(index, 1);
                            updateCart();
                        });
        
                        listItem.appendChild(itemContent);
                        listItem.appendChild(removeBtn);
                        cartItems.appendChild(listItem);
                        totalCartPrice += item.total;
                    });
                }
        
                cartTotal.textContent = `Rp ${totalCartPrice.toLocaleString('id-ID')}`;
                whatsappBtn.disabled = cart.length === 0;
            }
        
            addToCartBtn.addEventListener('click', function() {
                const selectedOption = productSizeSelect.selectedOptions[0];
                const productSize = selectedOption.text.split(' - ')[0];
                const quantity = parseInt(quantityInput.value);
                const image = selectedOption.getAttribute('data-image');
        
                if (!productSizeSelect.value || !quantity) {
                    alert('Please select product and quantity before adding to the cart.');
                    return;
                }
        
                const price = parseInt(selectedOption.dataset.price);
                const total = price * quantity;
        
                const existingItemIndex = cart.findIndex(item => item.size === productSize);
        
                if (existingItemIndex >= 0) {
                    cart[existingItemIndex].quantity += quantity;
                    cart[existingItemIndex].total = cart[existingItemIndex].quantity * price;
                } else {
                    cart.push({
                        size: productSize,
                        quantity: quantity,
                        total: total,
                        image: image
                    });
                }
        
                updateCart();
            });
        
            whatsappBtn.addEventListener('click', function() {
                const message = cart.map(item => 
                    `${item.quantity}x ${item.size} - Rp ${item.total.toLocaleString('id-ID')}`
                ).join('\n');
                const totalCartPrice = cart.reduce((sum, item) => sum + item.total, 0);
                const finalMessage = `Hello! I would like to order:\n\n${message}\n\nTotal: Rp ${totalCartPrice.toLocaleString('id-ID')}`;
                const encodedMessage = encodeURIComponent(finalMessage);
                const whatsappNumber = '6285648423768';
                window.open(`https://wa.me/${whatsappNumber}?text=${encodedMessage}`, '_blank');
            });
        });
    </script>
</body>
</html>
